<!DOCTYPE html>

<head>

            <p>Découvre nos jeux et commence à jouer !</p>

            <button id="gamesButton">

            <div class="game-card">

            <div class="game-card">
                <h3>⭕ Morpion</h3>
                <p>Aligne 3 symboles pour gagner.</p>
                <button>Jouer</button>
            </div>

            <div class="game-card">
                <h3>🧠 Memory</h3>
                <p>Retrouve toutes les paires.</p>
                <button>Jouer</button>
            </div>

    <footer>
        <p>© 2026 X Games</p>
    </footer>
